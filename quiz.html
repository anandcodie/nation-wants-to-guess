<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>html{color-scheme:dark}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Nation Wants to Guess Deluxe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=Inter:wght@400;600;700&display=swap">
<style>
/* Layout: one file, three views picked by the hash. #tv is a 16:9 stage read from across a room; #host is a one-column phone remote; no hash is the lobby. Single deliberate dark game-show look. */
:root{
  --bg:#0B0A1F; --panel:#17153B; --panel2:#221F52; --line:#353170;
  --fg:#FFF8EC; --muted:#A9A3C9; --dim:#6F6A98;
  --accent:#FFD23F; --hot:#FF3D81; --teal:#2EE6D6; --good:#4ADE80; --bad:#FF6B6B;
  --t0:#FF3D81; --t1:#2EE6D6; --t2:#FFD23F; --t3:#9B7BFF;
  --display:'Bricolage Grotesque','Arial Black',Impact,sans-serif;
  --body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.35;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
input{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:800;line-height:1.05;margin:0;text-wrap:balance}
.num{font-variant-numeric:tabular-nums}
.eyebrow{font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- Lobby ---------- */
.lobby{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding-block:40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center}
.lobby h1{font-size:clamp(2.4rem,8vw,5rem);color:var(--accent)}
.lobby p{max-width:34rem;color:var(--muted);margin:0}
.lobby .choices{display:flex;flex-wrap:wrap;gap:16px;justify-content:center;width:100%;max-width:640px}
.bigbtn{flex:1 1 240px;min-width:0;background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px 18px;text-align:left;display:flex;flex-direction:column;gap:6px}
.bigbtn:active{transform:scale(.98)}
.bigbtn b{font-family:var(--display);font-size:1.5rem}
.bigbtn span{color:var(--muted);font-size:.92rem}
.bigbtn.hot{border-color:var(--hot)}
.bigbtn.teal{border-color:var(--teal)}

/* ---------- TV stage ---------- */
.tv{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;background:var(--bg);overflow:hidden;cursor:none;--hue:265}
.tv>*{position:relative;z-index:1}
.aurora{position:absolute;inset:-25%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.5}
.aurora i{position:absolute;border-radius:50%;width:55vw;height:55vw;background:hsl(var(--hue) 90% 55%);animation:drift 20s ease-in-out infinite alternate;transition:background 1.2s}
.aurora i:nth-child(1){left:-5%;top:-15%}
.aurora i:nth-child(2){right:-10%;top:15%;background:hsl(calc(var(--hue) + 70) 90% 55%);animation-duration:26s;animation-delay:-9s}
.aurora i:nth-child(3){left:25%;bottom:-35%;background:hsl(calc(var(--hue) - 60) 85% 50%);animation-duration:31s;animation-delay:-15s}
@keyframes drift{from{transform:translate(0,0) scale(1)}to{transform:translate(10vw,8vh) scale(1.25)}}
.tv::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1.5px);background-size:26px 26px}
.tv.low::before{content:"";position:absolute;inset:0;z-index:2;pointer-events:none;box-shadow:inset 0 0 14vw rgba(255,61,129,.55);animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:1}}
.stage.enter{animation:rise .6s cubic-bezier(.2,.9,.3,1.15) both}
@keyframes rise{from{opacity:0;transform:translateY(40px) scale(.96)}to{opacity:1;transform:none}}
.stage .ans{position:relative;overflow:hidden;box-shadow:0 0 40px rgba(255,210,63,.35)}
.stage .ans::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.35) 50%,transparent 65%);transform:translateX(-120%);animation:shine 1.1s .25s forwards}
@keyframes shine{to{transform:translateX(120%)}}
.scorechip{transition:transform .3s,box-shadow .3s}
.scorechip.bump{transform:translateY(-6px);box-shadow:0 0 0 3px var(--tc) inset,0 0 30px var(--tc)}
.scorechip.bump .s{animation:bump .7s cubic-bezier(.2,1.6,.4,1)}
@keyframes bump{35%{transform:scale(1.5)}}
.burst{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;gap:1vh}
.burst b{font-family:var(--display);font-size:clamp(4rem,14vw,14rem);line-height:1;color:var(--tc);text-shadow:0 0 50px var(--tc),0 6px 0 rgba(0,0,0,.4);animation:burstIn 1.5s cubic-bezier(.2,1.5,.4,1) forwards}
.burst span{font-family:var(--display);font-size:clamp(1.4rem,4vw,4rem);color:var(--fg);animation:burstIn 1.5s .05s cubic-bezier(.2,1.5,.4,1) forwards}
.burst.bad b{color:var(--bad);text-shadow:0 0 50px var(--bad);animation:shake 1.4s forwards}
@keyframes burstIn{0%{transform:scale(.2) rotate(-8deg);opacity:0}25%{transform:scale(1.1) rotate(2deg);opacity:1}75%{transform:scale(1) rotate(0);opacity:1}100%{transform:scale(1.15);opacity:0}}
@keyframes shake{0%{opacity:0;transform:translateX(0)}10%{opacity:1}20%{transform:translateX(-18px)}40%{transform:translateX(18px)}60%{transform:translateX(-10px)}80%{transform:translateX(10px);opacity:1}100%{transform:translateX(0);opacity:0}}
.burst .bits{position:absolute;inset:0}
.burst .bits i{position:absolute;left:50%;top:50%;width:1vw;height:2vh;background:var(--c);border-radius:2px;animation:fly 1.4s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(720deg);opacity:0}}
.board .cat{transform:skew(-6deg);background:linear-gradient(135deg,var(--hot),#ff7ab0);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.board .cat>*{transform:skew(6deg)}
.board .tile{transition:transform .6s,opacity .6s,background .3s;transform-style:preserve-3d;box-shadow:0 4px 0 rgba(0,0,0,.3)}
.board .tile.used{transform:rotateY(180deg) scale(.9);opacity:.12;background:var(--panel);color:transparent}
.stage.enter .board .tile{animation:rise .5s both}
.hint{animation:none}
.hint.new{animation:slideIn .55s cubic-bezier(.2,.9,.3,1.2) both}
@keyframes slideIn{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:none}}
.emoji .g{display:inline-block}
.stage.enter .emoji .g{animation:bounceIn .8s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes bounceIn{0%{transform:translateY(-70px) scale(.4);opacity:0}60%{transform:translateY(12px) scale(1.08);opacity:1}100%{transform:none}}
.stage.enter.tv-intro h2 .w{display:inline-block;animation:rise .7s both}
.rules{list-style:none;margin:0;padding:0;display:grid;gap:1.4vh;width:min(100%,1100px);text-align:left}
.rules li{display:grid;grid-template-columns:auto 1fr;gap:1.6vw;align-items:center;background:var(--panel);border-radius:14px;padding:1.4vh 2vw;font-size:clamp(1.05rem,2.1vw,1.9rem);font-weight:600}
.rules li .i{font-family:var(--display);color:var(--accent);font-size:1.3em;width:1.3em}
.stage.enter .rules li{animation:slideIn .55s cubic-bezier(.2,.9,.3,1.2) both}
.wish{font-family:var(--display);font-size:clamp(1.4rem,3.4vw,3.2rem);color:var(--hot);margin-top:1vh}
.tv-intro .rn{display:inline-block;background:var(--hot);color:#1a0616;padding:.4vh 1.4vw;border-radius:999px;transform:rotate(-3deg)}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:2vw;width:min(100%,1100px);height:40vh}
.podium .step{flex:1;display:flex;flex-direction:column;align-items:center;gap:1vh;height:100%;justify-content:flex-end}
.podium .step .n{font-family:var(--display);font-size:clamp(1rem,2.4vw,2.2rem);color:var(--tc);text-align:center}
.podium .step .block{width:100%;background:linear-gradient(180deg,var(--tc),color-mix(in srgb,var(--tc) 35%,#000));border-radius:16px 16px 0 0;display:flex;flex-direction:column;align-items:center;padding-top:1.4vh;transform-origin:bottom;animation:riseUp .9s cubic-bezier(.2,.9,.3,1.1) both}
.podium .step .block .pos{font-family:var(--display);font-size:clamp(1.6rem,4vw,4rem);color:#120f2a;line-height:1}
.podium .step .block .s{font-family:var(--display);font-size:clamp(1.2rem,2.6vw,2.4rem);color:#120f2a}
.podium .p0 .block{height:70%}.podium .p1 .block{height:48%;animation-delay:.25s}.podium .p2 .block{height:34%;animation-delay:.5s}
@keyframes riseUp{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.winner h1{text-shadow:0 0 60px var(--tc)}
.drumroll{font-size:clamp(5rem,16vw,16rem);line-height:1;animation:drum .12s infinite alternate}
@keyframes drum{from{transform:rotate(-8deg) scale(1)}to{transform:rotate(8deg) scale(1.08)}}
.dots i{display:inline-block;font-style:normal;animation:blinkdot 1.2s infinite}
.dots i:nth-child(2){animation-delay:.3s}.dots i:nth-child(3){animation-delay:.6s}
@keyframes blinkdot{0%,100%{opacity:.2}50%{opacity:1}}
.tv-title h1{text-shadow:0 0 80px rgba(255,210,63,.45)}
.stage.enter.tv-title h1{animation:rise .9s both}
.stage.enter.tv-title .with{animation:rise .6s .3s both}
@media (prefers-reduced-motion:reduce){.aurora i{animation:none}}
.tv.show-cursor{cursor:auto}
.tv-top{display:flex;align-items:center;justify-content:space-between;gap:20px;padding:1.6vh 3vw;padding-left:max(3vw,env(safe-area-inset-left,0px));padding-right:max(3vw,env(safe-area-inset-right,0px))}
.tv-brand{font-family:var(--display);font-weight:800;font-size:clamp(1rem,2.4vw,2rem);color:var(--accent);letter-spacing:.01em}
.tv-brand small{color:var(--muted);font-family:var(--body);font-weight:600;font-size:.55em;margin-left:.8em;letter-spacing:.12em;text-transform:uppercase}
.tv-round{font-size:clamp(.8rem,1.6vw,1.3rem);color:var(--muted);font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.tv-timer{display:none;align-items:center;gap:.6vw;font-family:var(--display);font-size:clamp(1.4rem,3.6vw,3.2rem);color:var(--fg)}
.tv-timer.on{display:flex}
.tv-timer .ring{width:clamp(36px,5vw,64px);height:clamp(36px,5vw,64px);border-radius:50%;background:conic-gradient(var(--accent) var(--p,100%),var(--panel2) 0)}
.tv-timer.low{color:var(--hot)}
.tv-timer.low .ring{background:conic-gradient(var(--hot) var(--p,100%),var(--panel2) 0)}
.tv-main{min-height:0;display:flex;align-items:center;justify-content:center;padding:1vh 4vw;padding-left:max(4vw,env(safe-area-inset-left,0px));padding-right:max(4vw,env(safe-area-inset-right,0px))}
.tv-bottom{display:flex;gap:1.2vw;padding:1.4vh 3vw 2vh;padding-left:max(3vw,env(safe-area-inset-left,0px));padding-right:max(3vw,env(safe-area-inset-right,0px))}
.scorechip{flex:1;display:flex;align-items:center;justify-content:space-between;gap:1vw;background:var(--panel);border-radius:14px;padding:1.2vh 1.6vw;border-left:.6vw solid var(--tc);min-width:0}
.scorechip .n{font-weight:700;font-size:clamp(.9rem,1.8vw,1.6rem);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.scorechip .s{font-family:var(--display);font-size:clamp(1.3rem,3vw,2.8rem);color:var(--tc)}
.scorechip.ctrl{box-shadow:0 0 0 3px var(--tc) inset}
.scorechip.locked{opacity:.45}
.stage{width:100%;max-width:1700px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2.4vh}
.stage .q{font-family:var(--display);font-weight:800;font-size:clamp(1.6rem,4.2vw,4.4rem);max-width:28ch;text-wrap:balance}
.stage .q.sm{font-size:clamp(1.3rem,3.2vw,3.2rem)}
.stage .ans{font-family:var(--display);font-size:clamp(1.5rem,4vw,4rem);color:var(--accent);background:var(--panel);border:3px solid var(--accent);border-radius:20px;padding:1.4vh 3vw;max-width:90%;animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
.stage .ans small{display:block;font-family:var(--body);font-weight:600;font-size:.4em;color:var(--muted);margin-top:.4em}
.stage .sub{color:var(--muted);font-size:clamp(1rem,1.9vw,1.6rem);max-width:60ch}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:scale(1);opacity:1}}
.waiting{color:var(--muted);font-size:clamp(1rem,2vw,1.6rem)}
.tv-title h1{font-size:clamp(3rem,9vw,9rem);color:var(--accent);line-height:.95}
.tv-title h1 span{display:block;color:var(--fg);font-size:.42em;font-weight:500;letter-spacing:.06em;margin-top:.3em}
.tv-title .with{color:var(--muted);font-size:clamp(1rem,2vw,1.6rem);letter-spacing:.14em;text-transform:uppercase}
.tv-intro .rn{font-size:clamp(1rem,2vw,1.6rem);color:var(--hot);letter-spacing:.2em;text-transform:uppercase;font-weight:700}
.tv-intro h2{font-size:clamp(2.6rem,7.5vw,7.5rem);color:var(--accent)}
.tv-intro .rule{font-size:clamp(1.1rem,2.2vw,1.9rem);color:var(--fg);max-width:46ch;line-height:1.4}
.tv-intro .pts{display:flex;gap:1.6vw;flex-wrap:wrap;justify-content:center}
.pill{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:.6vh 1.6vw;font-size:clamp(.9rem,1.6vw,1.3rem);font-weight:700}
.pill b{color:var(--accent)}

/* percent round */
.guesses{display:flex;gap:1.6vw;flex-wrap:wrap;justify-content:center}
.guess{background:var(--panel);border-top:.5vw solid var(--tc);border-radius:16px;padding:1.4vh 2.4vw;min-width:12vw}
.guess .n{color:var(--muted);font-weight:600;font-size:clamp(.8rem,1.4vw,1.2rem)}
.guess .g{font-family:var(--display);font-size:clamp(1.6rem,4vw,4rem);color:var(--tc)}
.guess.win{box-shadow:0 0 0 3px var(--accent)}

/* board */
.board{display:grid;grid-template-columns:repeat(var(--cols,5),1fr);gap:1vw;width:100%;max-width:1700px;height:62vh}
.board .cat{background:var(--hot);color:#1a0616;font-family:var(--display);font-weight:800;font-size:clamp(.9rem,1.9vw,1.9rem);border-radius:12px;display:flex;align-items:center;justify-content:center;text-align:center;padding:.6vh .6vw;line-height:1.05}
.board .tile{background:var(--panel2);border:2px solid var(--line);border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-size:clamp(1.4rem,3.6vw,3.6rem);color:var(--accent)}
.board .tile.used{background:transparent;border-color:var(--panel);color:transparent}
.board .tile.open{background:var(--accent);color:#1a1200;animation:blink .8s ease-in-out infinite alternate}
@keyframes blink{from{filter:brightness(1)}to{filter:brightness(1.35)}}
.tileview{display:flex;flex-direction:column;align-items:center;gap:2.4vh;width:100%}
.tileview .cat{color:var(--hot);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:clamp(.9rem,1.8vw,1.5rem)}
.tileview .pts{font-family:var(--display);font-size:clamp(1.2rem,2.6vw,2.4rem);color:var(--accent)}
.allin{font-family:var(--display);font-size:clamp(3rem,10vw,10rem);color:var(--hot);animation:pop .5s cubic-bezier(.2,1.4,.4,1);line-height:1}
.allin small{display:block;font-size:.22em;color:var(--fg);font-family:var(--body);font-weight:600;letter-spacing:.2em;text-transform:uppercase}

/* rank */
.ranklist{display:grid;gap:1.2vh;width:min(100%,900px)}
.rankrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:1.6vw;background:var(--panel);border-radius:14px;padding:1.2vh 2vw;font-size:clamp(1.1rem,2.4vw,2.2rem);font-weight:700;text-align:left}
.rankrow .i{font-family:var(--display);color:var(--accent);width:1.6em}
.rankrow .m{color:var(--muted);font-size:.65em;font-weight:600}
.rankrow.rev{border:2px solid var(--good);animation:pop .3s}
.rankrow.pending{opacity:.35}
.pool{display:flex;flex-wrap:wrap;gap:1vw;justify-content:center}
.pool .pill{font-size:clamp(1rem,2vw,1.8rem)}

/* emoji */
.emoji{font-size:clamp(3.5rem,12vw,12rem);line-height:1.15;letter-spacing:.06em}
.buzzbar{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(12vh + env(safe-area-inset-bottom,0px));z-index:4;font-family:var(--display);border-radius:999px;padding:1.2vh 3vw;white-space:nowrap;max-width:94vw;overflow:hidden;text-overflow:ellipsis}
.buzzbar.armed{font-size:clamp(.9rem,1.6vw,1.4rem);color:var(--muted);background:rgba(23,21,59,.8);border:2px solid var(--line)}
.buzzbar.hit.bad{color:#fff}
.buzzbar.wrap{white-space:normal;text-align:center;line-height:1.15;border-radius:24px}
.buzzbar.hit{font-size:clamp(1.6rem,4vw,4rem);color:#120f2a;background:var(--tc);box-shadow:0 0 60px var(--tc);animation:popbar .4s cubic-bezier(.2,1.5,.4,1)}
@keyframes popbar{from{transform:translateX(-50%) scale(.5);opacity:0}to{transform:translateX(-50%) scale(1);opacity:1}}
.buzzpad{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:24px;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center;background:radial-gradient(60vw 60vw at 50% 45%,color-mix(in srgb,var(--tc) 25%,var(--bg)),var(--bg))}
.buzzpad .bp-top{display:flex;gap:16px;justify-content:space-between;width:100%;max-width:420px;font-size:1rem}
.bp-btn{width:min(78vw,78vh,420px);height:min(78vw,78vh,420px);border-radius:50%;background:var(--tc);color:#120f2a;font-family:var(--display);font-weight:800;font-size:min(16vw,16vh,86px);box-shadow:0 14px 0 color-mix(in srgb,var(--tc) 50%,#000),0 0 80px var(--tc);transition:transform .08s,box-shadow .08s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.bp-btn:active{transform:translateY(10px);box-shadow:0 4px 0 color-mix(in srgb,var(--tc) 50%,#000),0 0 40px var(--tc)}
.bp-btn:disabled{opacity:.45;box-shadow:0 6px 0 color-mix(in srgb,var(--tc) 50%,#000);transform:none}
.buzzpad.first .bp-btn{opacity:1;background:var(--accent);animation:bump 1s infinite alternate}
.buzzpad.late .bp-btn{opacity:.3}
.bp-status{font-family:var(--display);font-size:1.5rem;max-width:22ch;text-wrap:balance}
.buzzpad.first .bp-status{color:var(--accent);font-size:2rem}
.player{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;gap:18px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));text-align:center;background:radial-gradient(60vw 60vw at 50% 40%,color-mix(in srgb,var(--tc) 22%,var(--bg)),var(--bg))}
.player .bp-top{display:flex;gap:16px;justify-content:space-between;width:100%;max-width:420px;font-size:1rem}
.pl-body{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;width:100%;max-width:420px}
.pl-big{font-size:4.5rem;line-height:1}
.pl-h{font-size:2rem}
.pl-q{font-size:1.25rem;font-weight:600;text-wrap:balance}
.pl-timer{font-family:var(--display);font-size:2.6rem;color:var(--accent);line-height:1}
.pl-timer.dim{color:var(--muted)}
.pl-won{font-family:var(--display);font-size:1.8rem;color:var(--good)}
.pl-won.zero{color:var(--muted);font-size:1.2rem}
.pl-dots{font-size:2.2rem;letter-spacing:.2em;color:var(--accent);line-height:1}
.player .field{width:100%}
.rk-list{display:flex;flex-direction:column;gap:8px;width:100%}
.rk-row{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;background:var(--panel);border:2px solid var(--line);border-radius:12px;padding:10px 12px;text-align:left;touch-action:none;user-select:none;-webkit-user-select:none;font-weight:600}

<script>

const SHOW = { title: "Nation Wants to Guess", subtitle: "SNN Edition" };
const ROUNDS = [
  { id: "r1", type: "percent", tag: "Round 1", name: "Nation Wants to Guess",
    rule: "A number question. Every team guesses a percentage. Closest guess wins, runner-up gets half.", pts: { win: 100, second: 50 } },
  { id: "r2", type: "board", tag: "Round 2", name: "Pick Me Behaviour",
    rule: "Teams take turns picking a tile. The category names are lying to you. Right answer, full points. Wrong answer, it passes to the other team for half. No minus points. One tile is All In." },
  { id: "r3", type: "rank", tag: "Round 3", name: "Rank Karo",
    rule: "Five things, one order. Teams write their order down. We reveal the real order one slot at a time.", pts: { slot: 50, perfect: 100 } },
  { id: "r4", type: "emoji", tag: "Round 4", name: "Emoji Kahani",
    rule: "A film, told in emoji. Buzz first to answer. Right answer +100. Wrong answer −100, and you're locked out for that picture.", pts: { win: 100 } },
  { id: "r5", type: "whoami", tag: "Final Round", name: "Who Am I?",
    rule: "One person per team, five hints, three guesses. Name them on hint 1 for 500 points, then 400, 300, 200 and 100 on hint 5. A wrong guess costs nothing but a guess. No passing.",
    pts: { hints: [500, 400, 300, 200, 100], guesses: 3 } }
];



const LEVELS={easy:{label:"Easy",blurb:"Everyone can play. School facts, big films, famous faces."},medium:{label:"Medium",blurb:"Earn your points. Lateral questions, cryptic hints, film-lover bait."},hard:{label:"Difficult",blurb:"For the show-offs. History, numbers, deep cuts."}};
const LCODE={easy:"e",medium:"m",hard:"h"};
const BANK=(typeof QUESTION_BANK==="object"&&QUESTION_BANK)||{percent:[],board:[],rank:[],emoji:[],who:[]};
function itemLevels(it){ const o=G&&G.sel&&G.sel[it.id]; if(o!=null) return Object.keys(LCODE).filter(k=>o.includes(LCODE[k])); return it.levels||[]; }
function inLevel(it,k){ return itemLevels(it).includes(k); }
function bankPick(type,k){ return (BANK[type]||[]).filter(it=>inLevel(it,k)); }
function buildPack(key){
  const k=LEVELS[key]?key:"medium"; const L=LEVELS[k];
  const picked=bankPick("board",k).slice(0,5);
  const cats=picked.map(c=>({title:c.title,meaning:c.meaning,tiles:c.tiles}));
  let allIn=null; picked.forEach((c,i)=>{ if(allIn==null&&c.allIn!=null) allIn=[i,c.allIn]; });
  return { title: SHOW.title, subtitle: SHOW.subtitle, level: L.label, key: k, rounds: [
    { ...ROUNDS[0], items: bankPick("percent",k) },
    { ...ROUNDS[1], categories: cats, allIn },
    { ...ROUNDS[2], items: bankPick("rank",k) },
    { ...ROUNDS[3], items: bankPick("emoji",k) },
    { ...ROUNDS[4], items: bankPick("who",k) }
  ]};
}

/* ===================== slides ===================== */
function buildSlides(){
  const S=[{k:"title",label:"Title"},{k:"rules",label:"Ground rules"}];
  const live=PACK.rounds.map((r,ri)=>(r.type==="board"?!!r.categories.length:!!r.items.length)?ri:-1).filter(x=>x>=0); const lastRi=live[live.length-1];
  PACK.rounds.forEach((r,ri)=>{
    if(r.type==="board"?!r.categories.length:!r.items.length) return;
    S.push({k:"intro",r:ri,label:r.tag+" · "+r.name});
    if(r.type==="board"){ S.push({k:"board",r:ri,label:r.name+" board"}); }
    else r.items.forEach((it,i)=>S.push({k:"q",r:ri,i,label:r.name+" "+(i+1)}));
    if(ri!==lastRi) S.push({k:"scores",r:ri,label:"Scores after "+r.tag});
  });
  S.push({k:"final",label:"Winner"});
  return S;
}

/* ===================== persistence & sync ===================== */
function loadLocal(){ try{ const j=localStorage.getItem("nwtg-state"); if(j){ const o=JSON.parse(j); if(o&&o.teams) G=o; } }catch(e){} }
function saveLocal(){ try{ localStorage.setItem("nwtg-state",JSON.stringify(G)); }catch(e){} }

let writeChain=Promise.resolve(), writeDirty=false, writing=false;
function flushDb(){
  if(!stateDoc||writing||!writeDirty) return;
  writeDirty=false; writing=true;
  const snapshot=JSON.parse(JSON.stringify(G));
  stateDoc.set(snapshot).then(()=>{dbState="synced";}).catch(e=>{dbState="error";console.warn("db write",e);}).finally(()=>{writing=false; updateStatus(); if(writeDirty) flushDb();});
}
function pushState(){
  G.v=(G.v||0)+1; G.t=Date.now();

  if(srvMode) srvPost();

}
function adopt(o,force){ if(!o||!o.teams) return; if(!force&&(o.v||0)<=(G.v||0)) return; G=o; saveLocal(); render(); }

/* ---- local server sync (server.py): plain HTTP long-polling, no accounts ---- */
let srvPosting=false, srvPostDirty=false, srvMs=0;
async function srvPost(){
  if(srvPosting){ srvPostDirty=true; return; }
  srvPosting=true;
  try{ await fetch("/state",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(G),cache:"no-store"}); dbState="synced"; }

  srvPosting=false; updateStatus();
  if(srvPostDirty){ srvPostDirty=false; srvPost(); }
}

  if(r.type==="percent"){ const el=document.getElementById("pct"); if(el) pctDraft=el.value; const n=pctDraft===""?null:Math.max(0,Math.min(100,Number(pctDraft))); sendMsg("answer",{s:G.s,value:(n==null||isNaN(n))?null:n}); }

    <div class="rk-list" id="rk">${rankDraft.map((x,i)=>`<div class="rk-row" data-item="${esc(x)}" onpointerdown="rkDown(event)" onpointermove="rkMove(event)" onpointerup="rkUp(event)" onpointercancel="rkUp(event)"><span class="i num">${i+1}</span><span class="rk-name">${esc(x)}</span><span class="rk-btns"><button class="btn sm" onpointerdown="event.stopPropagation()" onclick="rkMoveBy(${i},-1)">▲</button><button class="btn sm" onpointerdown="event.stopPropagation()" onclick="rkMoveBy(${i},1)">▼</button></span></div>`).join("")}</div>
    <button class="btn primary" style="min-height:60px;font-size:1.2rem;width:100%" onclick="submitAnswer()">Submit order</button><div class="note">Auto-submits when the timer runs out.</div>`; }
function plWho(r,sl,rv){ const ti=whoTeam(); const mine=ti===myTeam; const h=rv.hints||0, used=rv.guesses||0, left=Math.max(0,r.pts.guesses-used); const now=h?r.pts.hints[Math.min(h,5)-1]:r.pts.hints[0];

function plBoard(r,rv){ const tt=(G.turn||0)%G.teams.length;
  if(!rv.open) return `<div class="pl-big">${tt===myTeam?"🎯":"👀"}</div><div class="bp-status">${tt===myTeam?"Your pick! Call out a category and points.":esc(G.teams[tt].name)+" are picking a tile."}</div>`;

function plEmoji(r,sl,rv){ const bz=G.buzz||{}; const first=bz.first||currentProv(); const mine=first&&first.peer===peerId; const lockedOut=(bz.locked||[]).includes(myTeam)||G.teams[myTeam].lock; const myPos=(bz.order||[]).findIndex(x=>x.team===myTeam); const passed=(bz.passed||[]).includes(myTeam)||passSentGen===(bz.gen||0);
  let status, big, cls="";
  if(bz.result){ const mine2=bz.result.team===myTeam; status=bz.result.ok?(mine2?"You got it! +"+bz.result.pts:esc(G.teams[bz.result.team].name)+" got it. It was "+esc(r.items[sl.i].a)+"."):(mine2?"Wrong, −"+bz.result.pen+". It was "+esc(r.items[sl.i].a)+".":esc(G.teams[bz.result.team].name)+" got it wrong. It was "+esc(r.items[sl.i].a)+"."); big=bz.result.ok?(mine2?"🎉":"🎬"):(mine2?"💔":"🎬"); }

let actx=null;
function beep(freq,dur,type){ try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); const o=actx.createOscillator(), g=actx.createGain(); o.type=type||"sine"; o.frequency.value=freq; g.gain.value=.12; o.connect(g); g.connect(actx.destination); o.start(); g.gain.exponentialRampToValueAtTime(.0001,actx.currentTime+dur); o.stop(actx.currentTime+dur);}catch(e){} }
function sting(kind){ if(mode!=="tv"||!tvStarted) return; if(kind==="reveal"){beep(660,.15);setTimeout(()=>beep(990,.3),120);} else if(kind==="good"){beep(523,.12);setTimeout(()=>beep(784,.12),100);setTimeout(()=>beep(1047,.3),200);} else if(kind==="bad"){beep(220,.4,"sawtooth");} else if(kind==="tick"){beep(880,.08,"square");} else if(kind==="allin"){[0,120,240,360].forEach((d,i)=>setTimeout(()=>beep(440+i*110,.2,"square"),d));} else if(kind==="buzz"){beep(1200,.08,"square");setTimeout(()=>beep(1600,.25,"square"),80);} }

function ansBox(a,shown){ return `<div class="a ${mirror&&!shown?"hid":""}" ${mirror&&!shown?'onclick="this.classList.toggle(\'hid\')"':""}>${esc(a)}</div>`; }
function teamBtns(fn,label){ return `<div class="row">${G.teams.map((t,i)=>`<button class="btn team" style="--tc:${tc(i)}" onclick="${fn}(${i})" ${t.lock?"disabled":""}>${esc(t.name)}${label?" "+label:""}</button>`).join("")}</div>`; }
function hostLeaderboard(){ return `<div class="log" style="font-size:1rem">${leaderboard().map((t,p)=>`<span style="display:flex;justify-content:space-between"><b style="color:${tc(t.i)}">${p+1}. ${esc(t.name)}</b><b class="num">${t.score}</b></span>`).join("")}</div>`; }

/* percent */
function subStatus(rv,fmt){ return `<div class="log">${G.teams.map((t,i)=>{ const s=rv.sub&&rv.sub[i]; return `<span><b style="color:${tc(i)}">${esc(t.name)}</b> · ${s?fmt(s):"thinking…"}${(rv.won||{})[i]?` · <b style="color:var(--good)">+${rv.won[i]}</b>`:""}</span>`; }).join("")}</div>`; }
function hostPercent(r,sl){
  const it=r.items[sl.i], rv=rev(); rv.guess=rv.guess||[]; const left=timerLeft();
  const ph=rv.phase||"open";
  return `<div class="card"><div class="eyebrow">Question ${sl.i+1} of ${r.items.length}</div><div class="q">${esc(it.q)}</div>${ansBox(it.a+"%",rv.revealed)}${it.note?`<div class="note">${esc(it.note)}</div>`:""}</div>
  <div class="card"><h3>${ph==="open"?"⏱ "+(left!=null?left+"s":"")+" · answers open":ph==="closed"?"Answers in · revealing in a moment":"Revealed"}</h3>
    ${subStatus(rv,s=>s.v!=null?s.v+"%":"no answer")}
    <div class="note">Players type on their phones. Closes when both are in or after ${T_PCT}s, then reveals 2 seconds later. Closest ${r.pts.win}, runner-up ${r.pts.second}.</div>
    <div class="row">${ph==="open"?`<button class="btn" onclick="closeSubmissions()">Close now</button>`:""}${ph!=="done"?`<button class="btn primary" onclick="revealPercentAuto()">Reveal now</button>`:""}<button class="btn ghost sm" onclick="restartSubmissions()">Restart ${T_PCT}s</button></div></div>
  <div class="card"><h3>No phones? Type the guesses</h3>
    <div class="row">${G.teams.map((t,i)=>`<div class="field" style="flex:1 1 30%"><label style="color:${tc(i)}">${esc(t.name)}</label><input id="g${i}" type="number" inputmode="numeric" min="0" max="100" placeholder="%" value="${rv.guess[i]!=null?rv.guess[i]:""}" onchange="setGuess(${i},this.value)"></div>`).join("")}</div>
    ${teamBtns("awardPercentWin","+"+r.pts.win)}${teamBtns("awardPercentSecond","+"+r.pts.second)}</div>`;
}
function setGuess(i,v){ rev().guess=rev().guess||[]; rev().guess[i]=v===""?null:Number(v); pushState(); }
function awardPercentWin(i){ award(i,roundOf(cur()).pts.win,"closest"); pushState(); }
function awardPercentSecond(i){ award(i,roundOf(cur()).pts.second,"runner-up"); pushState(); }

/* board */
function hostBoard(r){
  const rv=rev(); rv.used=rv.used||{};
  const isAllIn=(c,t)=>r.allIn&&r.allIn[0]===c&&r.allIn[1]===t;
  const n=Object.keys(rv.used).length, total=r.categories.length*4; const left=timerLeft();
  if(rv.open){
    const [c,t]=rv.open.split("-").map(Number); const cat=r.categories[c], tile=cat.tiles[t];
    if(rv.allin&&rv.allin.stage==="splash") return `<div class="card"><h3>🎰 ALL IN</h3><div class="note">The question shows in a moment. ${esc(G.teams[rv.allin.team].name)}'s entire score is at stake.</div></div>`;
    const half=Math.round(tile.pts/2);
    let play;
    if(rv.allin&&(rv.passTo==null||rv.revealed)){ const a=rv.allin; const nm=esc(G.teams[a.team].name); const at=G.teams[a.team].score;
      play=rv.revealed?`<div class="note"><b>${a.result==="safe"?nm+" answered right and keeps the points.":nm+" lost "+a.amt+"."+(a.winner!=null?" "+esc(G.teams[a.winner].name)+" picked up "+a.half+".":" Nobody picked up the half.")}</b></div>`
      :`<div class="note"><b>ALL IN.</b> ${nm}'s entire <b>${at}</b> points are on the line. Right: they keep them. Wrong, or the timer runs out: they drop to 0 and the question passes to the other team for ${Math.round(at/2)}.</div><div class="row"><button class="btn good" onclick="allInRight()">✓ Right, keep ${at}</button><button class="btn bad" onclick="allInWrong()">✗ Wrong, lose ${at}</button></div>`; }
    else if(rv.allin){ const a=rv.allin; const ti=rv.passTo; const more=(rv.tried||[]).length<G.teams.length; play=`<div class="note">${esc(G.teams[a.team].name)} lost ${a.amt}. Passed to <b style="color:${tc(ti)}">${esc(G.teams[ti].name)}</b> for ${a.half}. Wrong or timer out: ${more?"passes on again":"nobody gets it"}.</div><div class="row"><button class="btn good" onclick="allInPassRight(${ti})">✓ ${esc(G.teams[ti].name)} +${a.half}</button><button class="btn bad" onclick="tilePass()">✗ Wrong${more?" → pass":""}</button></div>`; }
    else if(rv.revealed){ play=`<div class="note"><b>Done.</b> Close the tile to go back to the board.</div>`; }
    else if(rv.passTo==null){ const ti=rv.turn; play=`<div class="note"><b style="color:${tc(ti)}">${esc(G.teams[ti].name)}</b> are answering. Right: +${tile.pts}. Wrong or timer out: passes over for ${half}.</div><div class="row"><button class="btn good" onclick="tileRight(${ti},${tile.pts})">✓ ${esc(G.teams[ti].name)} +${tile.pts}</button><button class="btn bad" onclick="tilePass()">✗ Wrong → pass</button></div>`; }
    else { const ti=rv.passTo; const more=(rv.tried||[]).length<G.teams.length; play=`<div class="note">Passed to <b style="color:${tc(ti)}">${esc(G.teams[ti].name)}</b> for ${half}. Wrong or timer out: ${more?"passes on again":"nobody scores"}.</div><div class="row"><button class="btn good" onclick="tileRight(${ti},${half})">✓ ${esc(G.teams[ti].name)} +${half}</button><button class="btn bad" onclick="tilePass()">✗ Wrong${more?" → pass":""}</button></div>`; }
    return `<div class="card"><div class="eyebrow">${esc(cat.title)} · ${tile.pts} points${!rv.revealed&&left!=null?" · ⏱ "+left+"s":""}</div><div class="note">Category is really about: <b>${esc(cat.meaning)}</b></div><div class="q">${esc(tile.q)}</div>${ansBox(tile.a,rv.revealed)}
      ${rv.revealed?"":`<button class="btn primary" onclick="rev().revealed=true;rev().deadline=null;G.timer.end=null;pushState()">Reveal answer</button>`}
      ${play}
      <button class="btn" onclick="closeTile()">Close tile → back to board</button></div>`;
  }
  const tt=(G.turn||0)%G.teams.length;
  return `<div class="card"><div class="eyebrow">${n} of ${total} tiles played</div><div class="note"><b style="color:${tc(tt)}">${esc(G.teams[tt].name)}</b> picks next. Tap the tile they call: a ${T_TILE}s timer starts for them.</div>
    <div class="h-tiles" style="--cols:${r.categories.length||1}">${r.categories.map(c=>`<div class="c">${esc(c.title)}</div>`).join("")}${[0,1,2,3].map(t=>r.categories.map((c,ci)=>`<button class="t ${rv.used[ci+"-"+t]?"used":""} ${isAllIn(ci,t)?"allin":""} num" onclick="openTile(${ci},${t})">${c.tiles[t].pts}</button>`).join("")).join("")}</div>
    <div class="note">Red-bordered tile is the hidden All In (only you can see that).</div>
    <div class="note">Whose turn (tap to override):</div>${teamBtns("setTurn")}
    ${n>=total?`<div class="note"><b>Board done.</b> Hit Next for the scores.</div>`:""}</div>
    <div class="card"><h3>Category cheat sheet</h3><div class="log">${r.categories.map(c=>`<span><b>${esc(c.title)}</b> → ${esc(c.meaning)}</span>`).join("")}</div></div>`;
}
function setTurn(i){ G.turn=i; pushState(); }
function openTile(c,t){ const r=roundOf(cur()), rv=rev(); const tt=(G.turn||0)%G.teams.length; rv.open=c+"-"+t; rv.revealed=false; rv.allin=null; rv.turn=tt; rv.passTo=null; rv.tried=[tt]; rv.deadline=Date.now()+T_TILE*1000; G.timer.dur=T_TILE; G.timer.end=rv.deadline;
  if(r.allIn&&r.allIn[0]===c&&r.allIn[1]===t){ rv.allin={stage:"splash",team:tt,amt:G.teams[tt].score}; rv.deadline=null; G.timer.end=null; pushState(); setTimeout(()=>{ const v=rev(); if(v.allin&&v.allin.stage==="splash"){ v.allin.stage="play"; v.deadline=Date.now()+T_TILE*1000; G.timer.dur=T_TILE; G.timer.end=v.deadline; pushState(); } },2200); return; }
  pushState(); }
function tileRight(i,p){ const rv=rev(); if(rv.revealed) return; award(i,p,"tile"); rv.revealed=true; rv.deadline=null; G.timer.end=null; pushState(); }
function tilePass(){ const rv=rev(); if(rv.revealed) return; const tried=rv.tried||[rv.turn]; const n=G.teams.length; let next=null; for(let k=1;k<n;k++){ const c=(rv.turn+k)%n; if(!tried.includes(c)){ next=c; break; } } rv.tried=tried; if(next==null){ rv.revealed=true; rv.deadline=null; G.timer.end=null; toast("Nobody scores"); } else { tried.push(next); rv.passTo=next; rv.deadline=Date.now()+T_TILE*1000; G.timer.dur=T_TILE; G.timer.end=rv.deadline; toast("Passed to "+G.teams[next].name); } pushState(); }
function allInRight(){ const rv=rev(); if(!rv.allin||rv.revealed) return; rv.allin.result="safe"; rv.allin.amt=G.teams[rv.allin.team].score; rv.revealed=true; rv.deadline=null; G.timer.end=null; toast(G.teams[rv.allin.team].name+" keep their points"); pushState(); }
function allInWrong(){ const rv=rev(); if(!rv.allin||rv.revealed||rv.passTo!=null) return; const a=rv.allin; const amt=G.teams[a.team].score; if(amt>0) award(a.team,-amt,"all in lost"); a.result="lost"; a.amt=amt; a.half=Math.round(amt/2); rv.tried=[a.team]; tilePass(); }
function allInPassRight(i){ const rv=rev(); if(!rv.allin||rv.revealed) return; const a=rv.allin; if(a.half) award(i,a.half,"all in half"); a.winner=i; rv.revealed=true; rv.deadline=null; G.timer.end=null; pushState(); }
function closeTile(){ const rv=rev(); rv.used=rv.used||{}; rv.used[rv.open]=true; rv.open=null; rv.revealed=false; rv.allin=null; rv.passTo=null; rv.deadline=null; G.turn=((G.turn||0)+1)%G.teams.length; G.timer.end=null; pushState(); }

/* rank */
function hostRank(r,sl){
  const it=r.items[sl.i], rv=rev(), shown=rv.shown||0; const left=timerLeft(); const ph=rv.phase||"open";
  return `<div class="card"><div class="eyebrow">Rank ${sl.i+1} of ${r.items.length}</div><div class="q">${esc(it.q)}</div>
    <div class="log" style="font-size:1rem">${it.items.map((x,i)=>`<span><b>${i+1}. ${esc(x)}</b> · ${esc(it.meta[i])}</span>`).join("")}</div>${it.note?`<div class="note">${esc(it.note)}</div>`:""}</div>
    <div class="card"><h3>${ph==="open"?"⏱ "+(left!=null?left+"s":"")+" · orders open":ph==="closed"?"Orders in · revealing in a moment":"Revealed"}</h3>
    ${subStatus(rv,s=>s.order&&s.order.length?s.order.map((x,i)=>(i+1)+". "+esc(x)).join(", "):"no order")}
    <div class="note">Players drag the order on their phones. Closes when both are in or after ${T_RANK}s, reveals 2 seconds later. ${r.pts.slot} per correct slot, +${r.pts.perfect} for a perfect order.</div>
    <div class="row">${ph==="open"?`<button class="btn" onclick="closeSubmissions()">Close now</button>`:""}${ph!=="done"?`<button class="btn primary" onclick="revealRankAuto()">Reveal now</button>`:""}<button class="btn ghost sm" onclick="restartSubmissions()">Restart ${T_RANK}s</button></div>
    <div class="row"><button class="btn sm" onclick="rev().shown=Math.min(${it.items.length},(rev().shown||0)+1);pushState()" ${shown>=it.items.length?"disabled":""}>Reveal slot ${Math.min(it.items.length,shown+1)} only</button></div></div>
    <div class="card"><h3>No phones? Score by hand</h3><div class="note">Tap how many slots each team got right.</div>
    ${G.teams.map((t,i)=>`<div class="teamrow"><span class="lbl" style="--tc:${tc(i)}">${esc(t.name)}</span><div class="row">${[1,2,3,4,5].map(n=>`<button class="btn sm team ${rv.scored&&rv.scored[i]===n?"fill":""}" style="--tc:${tc(i)}" onclick="rankScore(${i},${n})">${n}</button>`).join("")}</div></div>`).join("")}</div>`;
}
function rankScore(i,n){ const r=roundOf(cur()), rv=rev(); rv.scored=rv.scored||{}; if(rv.scored[i]){ toast("Already scored. Use Undo first."); return; } rv.scored[i]=n; award(i,n*r.pts.slot+(n===5?r.pts.perfect:0),n+" slots"); pushState(); }

/* emoji */
function hostEmoji(r,sl){
  const it=r.items[sl.i], rv=rev();
  return `<div class="card"><div class="eyebrow">Picture ${sl.i+1} of ${r.items.length}</div><div class="emoji" style="font-size:2.4rem">${emojiHTML(it.emoji)}</div>${ansBox(it.a,rv.revealed)}${it.note?`<div class="note">${esc(it.note)}</div>`:""}
    ${rv.revealed?"":`<button class="btn primary" onclick="rev().revealed=true;pushState()">Reveal answer</button>`}</div>
    ${hostBuzzCard(r)}
    <div class="card"><h3>No phones? Score by hand</h3><div class="note">+${r.pts.win} right, −${r.pts.win} and locked out when wrong.</div>${teamBtns("emojiWin","+"+r.pts.win)}${teamBtns("emojiMiss","−"+r.pts.win)}</div>`;
}
function hostBuzzCard(r){
  const bz=G.buzz||{}; const linked=srvMode||(relay&&relayState==="on")||!!room;
  if(G.buzzOn===false) return `<div class="card"><h3>🔔 Buzzers off</h3><div class="row"><button class="btn sm" onclick="G.buzzOn=true;armBuzz();pushState()">Switch on</button></div></div>`;
  const order=(bz.order||[]).map((x,i)=>`<span>${i+1}. <b style="color:${tc(x.team)}">${esc(G.teams[x.team].name)}</b>${x.name?" · "+esc(x.name):""}${i>0&&bz.first?" (+"+((x.t-bz.first.t)/1000).toFixed(2)+"s)":""}</span>`).join("");
  const lockedTxt=(bz.locked||[]).map(i=>esc(G.teams[i].name)).join(", ")||"nobody"; const passedTxt=(bz.passed||[]).map(i=>esc(G.teams[i].name)).join(", ");
  return `<div class="card"><h3>🔔 Buzzers ${bz.armed?(bz.first?"· hit":bz.passOpen?"· buzz or pass":"· armed"):"· off"}</h3>
    ${!linked?`<div class="note">Players' phones need the Wi-Fi server or relay link; through the Claude link they cannot connect.</div>`:""}
    ${bz.first?`<div class="a" style="border-color:${tc(bz.first.team)};color:${tc(bz.first.team)};background:transparent">${esc(G.teams[bz.first.team].name)} to answer</div><div class="log">${order}</div>
      <div class="row"><button class="btn good" onclick="emojiWin(${bz.first.team})">✓ Correct +${r.pts.win}</button><button class="btn bad" onclick="buzzWrong()">✗ Wrong −${r.pts.win}</button></div><div class="note">Wrong: locked out, and the next team that buzzed gets it. If nobody else buzzed, the others can buzz or pass.</div>`:`<div class="note">${bz.armed?"Waiting for a buzz. Locked out: "+lockedTxt+"."+(passedTxt?" Passed: "+passedTxt+".":""):"Not armed on this slide."}</div>`}
    <div class="row"><button class="btn sm" onclick="buzzReset()">Reset buzzers</button><button class="btn sm ghost" onclick="G.buzzOn=false;armBuzz();pushState()">Switch off</button></div></div>`;
}
function emojiWin(i){ const w=roundOf(cur()).pts.win; award(i,w,"emoji"); rev().revealed=true; G.teams.forEach(t=>t.lock=false); if(G.buzz){ G.buzz.armed=false; G.buzz.result={team:i,ok:true,pts:w,handed:!!(G.buzz.first&&G.buzz.first.handed)}; G.buzz.first=null; } pushState(); }
function emojiMiss(i){ const r=roundOf(cur()); award(i,-r.pts.win,"wrong buzz"); G.teams[i].lock=true; if(G.buzz){ G.buzz.locked=(G.buzz.locked||[]).concat([i]); G.buzz.lastWrong={team:i,pen:r.pts.win}; if(G.buzz.first&&G.buzz.first.team===i) G.buzz.first=null; } pushState(); }
function lockTeam(i){ G.teams[i].lock=true; pushState(); }

/* who am i */
function hostWho(r,sl){
  const it=r.items[sl.i], rv=rev(); const ti=whoTeam(); const t=G.teams[ti];
  const h=rv.hints||0, used=rv.guesses||0, left=Math.max(0,r.pts.guesses-used), now=h?r.pts.hints[Math.min(h,5)-1]:r.pts.hints[0];
  if(!h){
    return `<div class="card"><div class="eyebrow">Who am I? · ${sl.i+1} of ${r.items.length}</div>${ansBox(it.a,false)}<h3 style="color:${tc(ti)}">${esc(t.name)}'s person</h3><div class="note">Only this team plays: ${r.pts.hints.join(" / ")} points by hint, ${r.pts.guesses} guesses, nothing lost on a wrong guess. Tap another team to change whose turn it is.</div>
      ${teamBtns("setWhoTeam")}
      <button class="btn primary" onclick="rev().hints=1;pushState()">Show hint 1 (worth ${r.pts.hints[0]})</button></div>`;
  }
  return `<div class="card"><div class="eyebrow">Who am I? · hint ${h} of 5 · <span style="color:${tc(ti)}">${esc(t.name)}</span></div>${ansBox(it.a,rv.revealed)}
    <div class="log" style="font-size:.95rem">${it.hints.map((x,i)=>`<span style="${i<h?"":"opacity:.4"}"><b>${i+1}.</b> ${esc(x)} <span class="num" style="color:var(--accent)">${r.pts.hints[i]}</span></span>`).join("")}</div>
    <div class="row"><button class="btn primary" onclick="rev().hints=Math.min(5,(rev().hints||0)+1);pushState()" ${h>=5||rv.done?"disabled":""}>Next hint</button><button class="btn" onclick="rev().revealed=true;pushState()" ${rv.revealed?"disabled":""}>Reveal identity</button></div></div>
    <div class="card"><h3>${esc(t.name)} · guesses ${"●".repeat(left)}${"○".repeat(used)}</h3>
    ${rv.done?`<div class="note"><b>${rv.done==="ok"?"✓ Got it on hint "+h+", +"+rv.won:"✗ Out of guesses, 0 points"}</b>. Hit Next for the next person.</div>`:`<div class="note">A correct answer right now is worth <b>${now}</b>. ${left} guess${left===1?"":"es"} left.</div>
    <div class="row"><button class="btn good" onclick="whoRight()">✓ Correct +${now}</button><button class="btn bad" onclick="whoWrong()">✗ Wrong guess</button></div>`}</div>`;
}
function setWhoTeam(i){ rev().team=i; pushState(); }
function whoRight(){ const r=roundOf(cur()), rv=rev(); const h=Math.min(rv.hints||1,5); const won=r.pts.hints[h-1]; award(whoTeam(),won,"who am I"); rv.won=won; rv.done="ok"; rv.revealed=true; pushState(); }
function whoWrong(){ const r=roundOf(cur()), rv=rev(); rv.guesses=(rv.guesses||0)+1; if(rv.guesses>=r.pts.guesses){ rv.done="x"; rv.revealed=true; toast("Out of guesses"); } else toast((r.pts.guesses-rv.guesses)+" guess"+(r.pts.guesses-rv.guesses===1?"":"es")+" left"); pushState(); }

/* timer */
let tickT=null, lastBeep=null;
function toggleTimer(){ if(G.timer.end){ G.timer.end=null; } else { G.timer.end=Date.now()+G.timer.dur*1000; } pushState(); }
function tick(){
  const left=timerLeft();
  document.querySelectorAll(".tnum").forEach(el=>el.textContent=left!=null?left:"");
  const tv=document.querySelector(".tv-timer"); if(tv){ tv.classList.toggle("on",left!=null); tv.classList.toggle("low",left!=null&&left<=5); const ring=tv.querySelector(".ring"); if(ring) ring.style.setProperty("--p",(left!=null?left/G.timer.dur*100:100)+"%"); }
  if(left!=null&&left<=3&&left!==lastBeep){ lastBeep=left; sting(left===0?"bad":"tick"); }
  if(left===0&&mode==="host"){ G.timer.end=null; pushState(); }
  if(mode==="host") hostAuto();
  if(mode==="buzz") playerAuto();
  if(mode==="tv"||mode==="buzz"){ const sl=cur(); if(sl.k==="final"){ const rv=G.rev["s"+G.s]||{}; const k=(rv.at||0)+":"+(drumOn()?"d":"w"); if(k!==drumKey){ drumKey=k; render(); } if(drumOn()&&mode==="tv"&&tvStarted) beep(150+Math.random()*60,.06,"square"); } }
}
setInterval(tick,250);

/* sheets */
function openSheet(n){ uiSheet=n; render(); }
function closeSheet(){ uiSheet=null; resetArmed=false; render(); }
let resetArmed=false;
function renderSheet(){
  if(uiSheet==="jump") return `<div class="sheet" onclick="if(event.target===this)closeSheet()"><div class="in"><h3>Jump to</h3><div class="jump">${SLIDES.map((s,i)=>`<button class="${i===G.s?"cur":""}" onclick="closeSheet();go(${i})"><span>${esc(s.label)}</span><small>${i+1}</small></button>`).join("")}</div><button class="btn" onclick="closeSheet()">Close</button></div></div>`;
  return `<div class="sheet" onclick="if(event.target===this)closeSheet()"><div class="in"><h3>Adjust scores</h3>
    ${G.teams.map((t,i)=>`<div class="teamrow"><span class="lbl" style="--tc:${tc(i)}">${esc(t.name)} · <span class="num">${t.score}</span></span><div class="row"><button class="btn sm" onclick="award(${i},-100,'adjust');pushState()">−100</button><button class="btn sm" onclick="award(${i},-50,'adjust');pushState()">−50</button><button class="btn sm" onclick="award(${i},50,'adjust');pushState()">+50</button><button class="btn sm" onclick="award(${i},100,'adjust');pushState()">+100</button></div></div>`).join("")}
    <h3>Applause bonus</h3><div class="note">For a wrong answer that deserved it anyway. +50.</div>${teamBtns("applause","👏")}
    ${playersCard(true)}
    <h3>Locks</h3><div class="row"><button class="btn" onclick="G.teams.forEach(t=>t.lock=false);pushState()">Unlock all teams</button></div>
    <h3>Timer length</h3><div class="row">${[15,30,45,60].map(n=>`<button class="btn sm ${G.timer.dur===n?"primary":""}" onclick="G.timer.dur=${n};pushState()">${n}s</button>`).join("")}</div>
    <h3>Mirror mode</h3><div class="note">For a single phone mirrored to the TV: answers are blurred until you tap them or reveal them.</div><button class="btn ${mirror?"primary":""}" onclick="setMirror(${!mirror})">${mirror?"Mirror mode on":"Mirror mode off"}</button>
    ${relayAvailable()?`<h3>Internet relay</h3><div class="note">${esc(relayState==="on"?"Connected to room "+relayCode:relayMsg||"Not connected. Type the code shown on the TV.")}</div><div class="row"><div class="field" style="flex:2"><input id="room2" maxlength="6" autocapitalize="characters" autocomplete="off" style="text-transform:uppercase;letter-spacing:.2em" value="${esc(relayCode||savedCode())}"></div><button class="btn primary" style="flex:1" onclick="relayConnect(document.getElementById('room2').value)">Connect</button></div>`:""}
    <h3>Game</h3><div class="row"><button class="btn" onclick="G.phase='setup';pushState()">Edit teams</button><button class="btn ghost" onclick="location.hash='tv'">Open TV view here</button></div>
    ${resetArmed?`<div class="row"><button class="btn hot" onclick="resetGame()">Yes, wipe scores and restart</button><button class="btn" onclick="resetArmed=false;render()">Keep playing</button></div>`:`<button class="btn bad" onclick="resetArmed=true;render()">Reset game…</button>`}
    <button class="btn" onclick="closeSheet()">Close</button></div></div>`;
}
function applause(i){ award(i,50,"applause"); pushState(); }
function setMirror(v){ mirror=v; try{ localStorage.setItem("nwtg-mirror",v?"1":"0"); }catch(e){} render(); }
function resetGame(){ const teams=G.teams.map(t=>({...t,score:0,lock:false})); const v=G.v, pk=G.pack, sel=G.sel, rg=(G.rgen||0)+1; G=defaultState(); G.v=v; G.teams=teams; G.pack=pk||"medium"; G.sel=sel||{}; G.rgen=rg; uiSheet=null; resetArmed=false; pushState(); }

/* question bank builder */
let builderOpen=false;
const BANK_SECTIONS=[["percent","Round 1 · Nation Wants to Guess",it=>esc(it.q)],["board","Round 2 · Pick Me Behaviour (categories)",it=>esc(it.title)+" → "+esc(it.meaning)],["rank","Round 3 · Rank Karo",it=>esc(it.q)],["emoji","Round 4 · Emoji Kahani",it=>emojiHTML(it.emoji)+"  "+esc(it.a)],["who","Final · Who Am I?",it=>esc(it.a)]];
function packCounts(k){ const c=BANK_SECTIONS.map(([t])=>bankPick(t,k).length); const warn=[]; if(c[1]!==5) warn.push(c[1]<5?"board has only "+c[1]+" categories":"board uses the first 5 of "+c[1]+" categories"); c.forEach((n,i)=>{ if(!n) warn.push(BANK_SECTIONS[i][1].split(" · ")[0]+" has no questions and will be skipped"); }); return `<b>${c[0]}</b> percent · <b>${c[1]}</b> board categories · <b>${c[2]}</b> rankings · <b>${c[3]}</b> emoji · <b>${c[4]}</b> people${warn.length?`<br><span style="color:var(--accent)">${esc(warn.join("; "))}.</span>`:""}`; }
function renderBuilder(){
  $app.innerHTML=`<div class="host" style="padding-bottom:40px"><div class="h-top"><div class="eyebrow">Question bank</div><h3>Choose questions</h3>
    <div class="h-status"><span>${Object.keys(LEVELS).map(k=>`<b>${LEVELS[k].label[0]}</b> ${BANK_SECTIONS.map(([t])=>bankPick(t,k).length).join("·")}`).join(" &nbsp; ")}</span><span>%·board·rank·emoji·who</span></div></div>
    <div class="h-body">
    <div class="card"><div class="note">Tap <b>E</b>, <b>M</b> or <b>D</b> to put a question in that pack. A question can sit in more than one. The board takes the first five categories ticked for a level. Your choices are saved with the game, so the TV builds the same quiz.</div><div class="row"><button class="btn primary" onclick="builderOpen=false;render()">Done</button><button class="btn ghost" onclick="G.sel={};pushState()">Reset to bank defaults</button></div></div>
    ${BANK_SECTIONS.map(([t,title,lab])=>`<div class="card"><h3>${esc(title)}</h3>${(BANK[t]||[]).map(it=>`<div class="teamrow"><span class="note" style="white-space:normal;color:var(--fg)">${lab(it)}${it.suggested&&!itemLevels(it).length?` <span style="color:var(--accent);font-size:.8em">· new, suggested ${esc(LEVELS[it.suggested]?LEVELS[it.suggested].label:it.suggested)}</span>`:""}</span><div class="row" style="flex:0 0 auto;flex-wrap:nowrap">${Object.keys(LEVELS).map(k=>`<button class="btn sm ${inLevel(it,k)?"primary":"ghost"}" style="min-width:42px;flex:0 0 auto" onclick="toggleLevel('${it.id}','${k}')">${LEVELS[k].label[0]}</button>`).join("")}</div></div>`).join("")}</div>`).join("")}
    <div class="card"><button class="btn primary" onclick="builderOpen=false;render()">Done</button></div></div></div>`;
}
function toggleLevel(id,k){ const it=Object.values(BANK).flat().find(x=>x.id===id); if(!it) return; let cur=itemLevels(it); cur=cur.includes(k)?cur.filter(x=>x!==k):cur.concat([k]); G.sel=G.sel||{}; const code=Object.keys(LCODE).filter(x=>cur.includes(x)).map(x=>LCODE[x]).join(""); const def=Object.keys(LCODE).filter(x=>(it.levels||[]).includes(x)).map(x=>LCODE[x]).join(""); if(code===def) delete G.sel[id]; else G.sel[id]=code; pushState(); }

function playersCard(inline){ const P=G.players||{}; const rows=G.teams.map((t,i)=>{ const p=P[i]; return `<div class="teamrow"><span class="lbl" style="--tc:${tc(i)}">${esc(t.name)} · <span style="color:var(--muted);font-weight:600">${p?"📱 "+esc(p.name||"device joined"):"no device yet"}</span></span>${p?`<button class="btn sm" onclick="releaseTeam(${i})">Release</button>`:""}</div>`; }).join(""); const body=`<div class="note">One phone per team. Players open the Player device page, pick a team, and the team locks. Release a team if a phone dies.</div>${rows}`; return inline?`<h3>Player devices</h3>${body}`:`<div class="card"><h3>Player devices</h3>${body}</div>`; }

/* setup */
let setupDraft=null;
function renderSetup(){
  if(!setupDraft){ setupDraft=G.teams.map(t=>({name:t.name,color:t.color})); setupDraft.pack=G.pack||"medium"; }
  $app.innerHTML=`<div class="host setup" style="padding-bottom:40px"><div class="h-top"><div class="eyebrow">Host remote</div><h3>Set up the teams</h3></div>
  <div class="h-body"><div class="card"><h3>Difficulty</h3><div class="row">${Object.keys(LEVELS).map(k=>`<button class="btn ${setupDraft.pack===k?"primary":""}" onclick="setupDraft.pack='${k}';render()">${esc(LEVELS[k].label)}</button>`).join("")}</div><div class="note">${esc(LEVELS[setupDraft.pack].blurb)}${(G.pack||"medium")!==setupDraft.pack&&(G.log.length||G.s>0)?" <b>Changing difficulty starts a fresh game.</b>":""}</div>
    <div class="note">${packCounts(setupDraft.pack)}</div><button class="btn" onclick="builderOpen=true;render()">Choose questions…</button></div>
  <div class="card"><h3>Teams</h3><div class="row"><button class="btn ${setupDraft.length===2?"primary":""}" onclick="setTeamCount(2)">2 teams</button><button class="btn ${setupDraft.length===3?"primary":""}" onclick="setTeamCount(3)">3 teams</button></div></div>
  <div class="teams">${setupDraft.map((t,i)=>`<div class="card"><div class="field"><label>Team ${i+1} name</label><input id="tn${i}" value="${esc(t.name)}" maxlength="18" onchange="setupDraft[${i}].name=this.value.trim()||'Team ${i+1}'"></div><div class="swatches">${TEAM_COLORS.map((c,ci)=>`<button class="${t.color===ci?"on":""}" style="--c:${c}" onclick="setupDraft[${i}].color=${ci};render()" aria-label="colour ${ci+1}"></button>`).join("")}</div></div>`).join("")}</div>
  ${playersCard()}
  <div class="card"><div class="note">Scores carry over if you only renamed a team. Open the TV view on the laptop first; it will say it is waiting for you.</div><button class="btn primary" onclick="startGame()">Start the show</button>${G.log.length||G.s>0?`<button class="btn" onclick="G.phase='play';setupDraft=null;pushState()">Back to the game</button>`:""}</div></div></div>`;
}
function setTeamCount(n){ while(setupDraft.length<n) setupDraft.push({name:"Team "+["Pink","Teal","Gold","Purple"][setupDraft.length],color:setupDraft.length}); setupDraft.length=n; render(); }
function startGame(){ document.querySelectorAll("[id^=tn]").forEach((el,i)=>{ if(setupDraft[i]) setupDraft[i].name=el.value.trim()||("Team "+(i+1)); });
  const old=G.teams; const changed=(G.pack||"medium")!==setupDraft.pack;
  G.teams=setupDraft.map((t,i)=>({name:t.name,color:t.color,score:old[i]&&!changed?old[i].score:0,lock:false}));
  if(changed){ G.pack=setupDraft.pack; G.rev={}; G.s=0; G.turn=0; G.log=[]; }
  G.phase="play"; setupDraft=null; pushState(); }

/* ===================== boot ===================== */
function boot(hot){
  routeMode();
  if(hot&&hot.G) G=hot.G; else loadLocal();
  if(window.claude&&window.claude.hot&&window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({G}));
  window.addEventListener("hashchange",()=>{ routeMode(); uiSheet=null; if(room) room.presence({role:mode}).catch(()=>{}); if(relayAvailable()&&!relay&&mode!=="lobby") relayAuto(); if(relay&&mode==="tv") try{ relay.publish(relayTopic("tv"),peerId); }catch(e){} render(); });
  render();
  connectCaps();
  srvConnect();
}
if(window.claude&&window.claude.hot&&window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude&&window.claude.hot&&window.claude.hot.data)||{});
</script>

</body>
</html>
